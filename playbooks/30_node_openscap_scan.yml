---
# OpenSCAP Node Compliance and Vulnerability Scan
# Targets: all Kubernetes nodes (masters + workers)
# Uses SCAP Security Guide (SSG) for CIS compliance and Canonical OVAL for vulnerabilities.
#
# Reports are fetched back to the controller under:
#   reports/nodes/
#
- name: OpenSCAP Node Compliance and Vulnerability Scan
  hosts: k8s_cluster
  become: yes
  gather_facts: yes

  vars:
    ssg_version: "0.1.76"
    ssg_url: "https://github.com/ComplianceAsCode/content/releases/download/v{{ ssg_version }}/scap-security-guide-{{ ssg_version }}.zip"
    ssg_extract_dir: "/tmp/scap-security-guide-{{ ssg_version }}"
    reports_dir: "/tmp/openscap-reports"
    local_reports_base: "{{ playbook_dir }}/../reports/nodes"

  tasks:
    - name: Ensure OpenSCAP tools and dependencies are installed
      ansible.builtin.apt:
        name:
          - openscap-scanner
          - openscap-utils
          - libopenscap25t64
          - unzip
          - bzip2
          - curl
          - jq
        state: present
        update_cache: yes

    - name: Create remote reports directory
      ansible.builtin.file:
        path: "{{ reports_dir }}"
        state: directory
        mode: '0755'

    - name: Download SCAP Security Guide (SSG)
      ansible.builtin.get_url:
        url: "{{ ssg_url }}"
        dest: "/tmp/ssg-{{ ssg_version }}.zip"
        mode: '0644'
      register: ssg_download

    - name: Extract SCAP Security Guide
      ansible.builtin.unarchive:
        src: "/tmp/ssg-{{ ssg_version }}.zip"
        dest: "/tmp/"
        remote_src: yes
        creates: "{{ ssg_extract_dir }}"

    - name: Find Ubuntu 24.04 datastream
      ansible.builtin.find:
        paths: "{{ ssg_extract_dir }}"
        patterns: "ssg-ubuntu2404-ds.xml"
        recurse: yes
      register: ubuntu2404_ds

    - name: Set Ubuntu 24.04 datastream
      ansible.builtin.set_fact:
        ssg_datastream: "{{ ubuntu2404_ds.files[0].path }}"
      when: ubuntu2404_ds.files | length > 0

    - name: Fallback to Ubuntu 22.04 datastream
      ansible.builtin.find:
        paths: "{{ ssg_extract_dir }}"
        patterns: "ssg-ubuntu2204-ds.xml"
        recurse: yes
      register: ubuntu2204_ds
      when: ssg_datastream is not defined

    - name: Set Ubuntu 22.04 fallback datastream
      ansible.builtin.set_fact:
        ssg_datastream: "{{ ubuntu2204_ds.files[0].path }}"
      when: ssg_datastream is not defined and ubuntu2204_ds.files | length > 0

    - name: Fail if no Ubuntu datastream found
      ansible.builtin.fail:
        msg: "No Ubuntu SSG datastream found in {{ ssg_extract_dir }}"
      when: ssg_datastream is not defined

    - name: Run compliance scan (CIS Level 1 Server)
      ansible.builtin.command: >-
        oscap xccdf eval
        --profile xccdf_org.ssgproject.content_profile_cis_level1_server
        --results {{ reports_dir }}/compliance-results.xml
        --report {{ reports_dir }}/compliance-report.html
        --fetch-remote-resources
        {{ ssg_datastream }}
      ignore_errors: yes
      register: compliance_scan

    - name: Download Canonical OVAL vulnerability definitions
      ansible.builtin.get_url:
        url: "https://security-metadata.canonical.com/oval/com.ubuntu.{{ ansible_distribution_release }}.usn.oval.xml.bz2"
        dest: "/tmp/ubuntu-oval.xml.bz2"
        mode: '0644'
      register: oval_download
      ignore_errors: yes

    - name: Decompress OVAL definitions
      ansible.builtin.command: "bunzip2 -f /tmp/ubuntu-oval.xml.bz2"
      args:
        creates: "/tmp/ubuntu-oval.xml"
      when: oval_download is succeeded

    - name: Run vulnerability scan
      ansible.builtin.command: >-
        oscap oval eval
        --results {{ reports_dir }}/vulnerability-results.xml
        --report {{ reports_dir }}/vulnerability-report.html
        /tmp/ubuntu-oval.xml
      ignore_errors: yes
      register: vuln_scan
      when: oval_download is succeeded

    - name: Create local report directory on controller
      ansible.builtin.file:
        path: "{{ local_reports_base }}/{{ inventory_hostname }}"
        state: directory
        mode: '0755'
      delegate_to: localhost
      become: no

    - name: Fetch reports from nodes to controller
      ansible.builtin.fetch:
        src: "{{ item }}"
        dest: "{{ local_reports_base }}/{{ inventory_hostname }}/"
        flat: yes
      loop:
        - "{{ reports_dir }}/compliance-results.xml"
        - "{{ reports_dir }}/compliance-report.html"
        - "{{ reports_dir }}/vulnerability-results.xml"
        - "{{ reports_dir }}/vulnerability-report.html"
      ignore_errors: yes

    - name: Display scan completion summary
      ansible.builtin.debug:
        msg: |
          Node {{ inventory_hostname }} scan complete.
          Reports saved to: {{ local_reports_base }}/{{ inventory_hostname }}/
          Compliance scan rc: {{ compliance_scan.rc | default('skipped') }}
          Vulnerability scan rc: {{ vuln_scan.rc | default('skipped') }}
