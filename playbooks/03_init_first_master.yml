---
- name: Initialize first Kubernetes control plane
  hosts: master1
  become: yes
  tasks:
    - name: Check if kubeadm has already been initialized
      stat:
        path: /etc/kubernetes/admin.conf
      register: kubeadm_init

    - name: Initialize Kubernetes cluster
      command: >
        kubeadm init
        --control-plane-endpoint={{ control_plane_endpoint }}
        --pod-network-cidr={{ pod_network_cidr }}
        --service-cidr={{ service_cidr }}
        --upload-certs
        --apiserver-advertise-address={{ ansible_host }}
        --ignore-preflight-errors=Mem
      when: not kubeadm_init.stat.exists
      register: kubeadm_init_output

    - name: Create .kube directory for ansible user
      file:
        path: "/home/ansible/.kube"
        state: directory
        mode: '0755'
        owner: ansible
        group: ansible

    - name: Copy admin.conf to ansible user kube config
      copy:
        src: /etc/kubernetes/admin.conf
        dest: "/home/ansible/.kube/config"
        remote_src: yes
        owner: ansible
        group: ansible
        mode: '0644'

    - name: Create .kube directory for root
      file:
        path: "/root/.kube"
        state: directory
        mode: '0755'

    - name: Copy admin.conf to root kube config
      copy:
        src: /etc/kubernetes/admin.conf
        dest: "/root/.kube/config"
        remote_src: yes
        mode: '0644'

    - name: Generate join command for workers
      command: kubeadm token create --print-join-command
      register: kubeadm_join_command
      changed_when: false

    - name: Upload certificates and get certificate key
      command: kubeadm init phase upload-certs --upload-certs
      register: kubeadm_certs
      changed_when: false

    - name: Extract certificate key
      set_fact:
        k8s_certificate_key: "{{ kubeadm_certs.stdout_lines | select('match', '^[a-f0-9]{64}$') | list | first }}"

    - name: Ensure local files directory exists
      file:
        path: "{{ playbook_dir }}/../files"
        state: directory
        mode: '0755'
      delegate_to: localhost
      become: no

    - name: Save worker join command locally
      copy:
        content: "{{ kubeadm_join_command.stdout }} --ignore-preflight-errors=Mem"
        dest: "{{ playbook_dir }}/../files/worker_join.sh"
        mode: '0600'
      delegate_to: localhost
      become: no

    - name: Save control plane join command locally
      copy:
        content: "{{ kubeadm_join_command.stdout }} --control-plane --certificate-key {{ k8s_certificate_key }} --ignore-preflight-errors=Mem"
        dest: "{{ playbook_dir }}/../files/master_join.sh"
        mode: '0600'
      delegate_to: localhost
      become: no

    - name: Save certificate key locally
      copy:
        content: "{{ k8s_certificate_key }}"
        dest: "{{ playbook_dir }}/../files/certificate_key.txt"
        mode: '0600'
      delegate_to: localhost
      become: no

    - name: Deploy Calico CNI
      command: >
        kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.27.3/manifests/calico.yaml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
