---
# K8s-safe CIS hardening using UBUNTU24-CIS (devel branch)
# Applies to all k8s_cluster nodes with k8s-safe overrides from group_vars/k8s_cluster/cis.yml

- name: Apply CIS hardening to K8s cluster nodes
  hosts: k8s_cluster
  become: true

  vars_files:
    - group_vars/k8s_cluster/cis.yml

  tasks:
    - name: Ensure required Ansible collections are present
      ansible.builtin.debug:
        msg: "Collections required: community.general, community.crypto, ansible.posix"

    - name: Apply UBUNTU24-CIS hardening (k8s-safe overrides)
      ansible.builtin.include_role:
        name: "/tmp/UBUNTU24-CIS"
      tags:
        - always
