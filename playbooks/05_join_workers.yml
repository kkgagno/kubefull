---
- name: Join worker nodes to cluster
  hosts: workers
  become: yes
  tasks:
    - name: Check if node is already joined
      stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf

    - name: Read worker join command from local file
      local_action:
        module: slurp
        src: "{{ playbook_dir }}/../files/worker_join.sh"
      register: worker_join_cmd
      become: no

    - name: Join worker node
      shell: "{{ worker_join_cmd.content | b64decode }}"
      when: not kubelet_conf.stat.exists
      register: join_output
      ignore_errors: yes

    - name: Display join result
      debug:
        msg: "{{ join_output.stdout }}"
      when: join_output is defined and not kubelet_conf.stat.exists
