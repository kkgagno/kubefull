---
- name: Install HAProxy TCP load balancer for Kubernetes API
  hosts: lb
  become: yes
  tasks:
    - name: Install haproxy
      apt:
        name: haproxy
        state: present
        update_cache: yes

    - name: Configure HAProxy for Kubernetes API
      copy:
        dest: /etc/haproxy/haproxy.cfg
        content: |
          global
            log /dev/log local0
            log /dev/log local1 notice
            chroot /var/lib/haproxy
            stats socket /run/haproxy/admin.sock mode 660 level admin
            stats timeout 30s
            user haproxy
            group haproxy
            daemon

          defaults
            log global
            mode tcp
            option tcplog
            option dontlognull
            timeout connect 5000
            timeout client 50000
            timeout server 50000

          frontend kubernetes-apiserver
            bind *:6443
            default_backend kubernetes-apiserver

          backend kubernetes-apiserver
            balance roundrobin
            server master1 192.168.4.168:6443 check
            server master2 192.168.4.167:6443 check
            server master3 192.168.4.171:6443 check
        mode: '0644'

    - name: Enable and restart haproxy
      systemd:
        name: haproxy
        state: restarted
        enabled: yes
