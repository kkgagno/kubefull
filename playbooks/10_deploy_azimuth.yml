---
- name: Deploy Azimuth self-service portal
  hosts: master1
  become: yes
  vars:
    azimuth_namespace: azimuth
    azimuth_version: "0.20.0"
  tasks:
    # NOTE: Azimuth is an OpenStack portal. Without an OpenStack backend, the portal
    # will start but cannot provision cloud resources. This playbook deploys it for
    # exploration/evaluation only. See README for full requirements.

    - name: Ensure azimuth namespace exists
      shell: kubectl create namespace {{ azimuth_namespace }} --dry-run=client -o yaml | kubectl apply -f -
      changed_when: false

    - name: Add Azimuth Helm repository
      shell: helm repo add azimuth https://azimuth-cloud.github.io/azimuth-helm-charts
      register: repo_add
      changed_when: "'already exists' not in repo_add.stderr"
      ignore_errors: yes

    - name: Update Helm repositories
      shell: helm repo update
      changed_when: false

    - name: Create minimal Azimuth values
      copy:
        dest: /tmp/azimuth-values.yaml
        content: |
          tags:
            apps: false
            clusters: false
            kubernetes: false

          api:
            replicaCount: 1
            resources:
              requests:
                memory: 128Mi
                cpu: 100m
              limits:
                memory: 512Mi
                cpu: 500m

          ui:
            replicaCount: 1
            resources:
              requests:
                memory: 64Mi
                cpu: 50m
              limits:
                memory: 256Mi
                cpu: 200m

          # Expose via NodePort for lab environments without ingress/DNS
          ingress:
            host: ""
            className: ""
            tls:
              enabled: false

          settings:
            secretKey: "change-me-in-production"
            debug: true
            currentCloud:
              name: lab
              label: Lab Cluster

          # Use null provider since we have no OpenStack
          # The portal will start but show no cloud resources
          authentication:
            type: openstack
            openstack:
              authUrl: ""
              projectName: ""
              internalProjectName: ""
              internalProjectDomain: ""

    - name: Deploy Azimuth
      shell: |
        helm upgrade --install azimuth azimuth/azimuth \
          --namespace {{ azimuth_namespace }} \
          --version {{ azimuth_version }} \
          --values /tmp/azimuth-values.yaml \
          --wait --timeout 5m
      changed_when: true
      ignore_errors: yes

    - name: Expose Azimuth UI via NodePort
      shell: |
        cat <<'EOF' | kubectl apply -f -
        apiVersion: v1
        kind: Service
        metadata:
          name: azimuth-ui-nodeport
          namespace: {{ azimuth_namespace }}
        spec:
          type: NodePort
          ports:
            - port: 80
              targetPort: 80
              nodePort: 30090
          selector:
            app.kubernetes.io/component: ui
            app.kubernetes.io/name: azimuth
        EOF
      changed_when: false

    - name: Check Azimuth pod status
      shell: kubectl get pods -n {{ azimuth_namespace }} -o custom-columns='NAME:.metadata.name,STATUS:.status.phase,READY:.status.containerStatuses[*].ready'
      changed_when: false
      register: azimuth_pods

    - name: Report Azimuth status
      debug:
        msg: |
          Azimuth pods status:
          {{ azimuth_pods.stdout }}

          Access the UI at: http://<any-node-ip>:30090
          NOTE: Without OpenStack, Azimuth will start but cannot provision resources.
          This deployment is for evaluation only.
