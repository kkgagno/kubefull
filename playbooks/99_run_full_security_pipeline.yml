---
# Full Security Scan Pipeline — One-shot orchestrator
# Runs OpenSCAP node scans, Kubescape scans, then generates all HTML summaries.
#
# Usage:
#   ansible-playbook -i inventory.ini playbooks/99_run_full_security_pipeline.yml
#
# Optional tags to run just a subset:
#   --tags openscap     (just node scans)
#   --tags kubescape    (just kubescape scans)
#   --tags reports      (just rebuild reports from existing data)
#
# Optional limit to specific nodes:
#   ansible-playbook -i inventory.ini playbooks/99_run_full_security_pipeline.yml --limit master1
#
- name: Full K8s Security Scan Pipeline
  import_playbook: 30_node_openscap_scan.yml
  tags: [always, openscap]

- name: Kubescape Scan
  import_playbook: 32_kubescape_scan.yml
  tags: [always, kubescape]

- name: Generate OpenSCAP Summary HTML
  import_playbook: 40_generate_openscap_summary.yml
  tags: [always, reports]

- name: Generate Kubescape Summary HTML
  import_playbook: 41_generate_kubescape_summary.yml
  tags: [always, reports]

- name: Generate Unified Master Index
  import_playbook: 42_generate_master_index.yml
  tags: [always, reports]
