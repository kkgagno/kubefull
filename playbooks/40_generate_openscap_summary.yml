---
# OpenSCAP Summary Report Generator
# Post-processes OpenSCAP XCCDF + OVAL XML into per-node HTML summaries
# and a master index page.  Run after playbook 30_node_openscap_scan.yml.
#
# Reports consumed:  reports/nodes/
# Reports produced:  reports/openscap-summaries/ (per-node), reports/openscap-index.html
#
- name: Generate OpenSCAP Summary Reports
  hosts: localhost
  gather_facts: no
  become: no

  vars:
    reports_base: "{{ playbook_dir | dirname }}/reports"
    scripts_dir: "{{ playbook_dir | dirname }}/scripts"

  tasks:
    - name: Ensure summary output directory exists
      ansible.builtin.file:
        path: "{{ reports_base }}/openscap-summaries"
        state: directory
        mode: '0755'

    - name: Find per-host OpenSCAP result files
      ansible.builtin.find:
        paths: "{{ reports_base }}/nodes"
        recurse: yes
        patterns:
          - "compliance-results.xml"
      register: found_compliance

    - name: Build host report map
      ansible.builtin.set_fact:
        host_reports: "{{ (host_reports | default({})) | combine({item.path | dirname | basename: item.path | dirname}) }}"
      loop: "{{ found_compliance.files }}"
      when: found_compliance.files | length > 0

    - name: Generate per-node OpenSCAP summary HTML
      ansible.builtin.command: >
        python3 {{ scripts_dir }}/parse_openscap_results.py
        --input {{ item.value }}/compliance-results.xml
        --vuln {{ item.value }}/vulnerability-results.xml
        --hostname {{ item.key }}
        --output {{ reports_base }}/openscap-summaries/{{ item.key }}.html
      loop: "{{ host_reports | default({}) | dict2items }}"
      ignore_errors: yes
      register: openscap_summary
      when: host_reports is defined and host_reports | length > 0

    - name: Generate master OpenSCAP index page
      ansible.builtin.copy:
        dest: "{{ reports_base }}/openscap-index.html"
        content: |
          {% set hosts = host_reports | default({}) %}
          {% if hosts | length == 0 %}
          No reports found. Run playbook 30_node_openscap_scan.yml first.
          {% endif %}
      when: false

    - name: Build OpenSCAP master index via inline template
      ansible.builtin.template:
        dest: "{{ reports_base }}/openscap-index.html"
        src: "{{ playbook_dir | dirname }}/templates/openscap_index.html.j2"
      when: host_reports is defined and host_reports | length > 0

    - name: Show summary
      ansible.builtin.debug:
        msg: |
          OpenSCAP summaries generated.
          Per-node: {{ reports_base }}/openscap-summaries/
          Index:    {{ reports_base }}/openscap-index.html
          Hosts:    {{ host_reports | default({}) | length }}
