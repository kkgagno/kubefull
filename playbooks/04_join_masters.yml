---
- name: Join additional control plane nodes
  hosts: master2,master3
  become: yes
  tasks:
    - name: Check if node is already joined
      stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf

    - name: Read control plane join command from local file
      local_action:
        module: slurp
        src: "{{ playbook_dir }}/../files/master_join.sh"
      register: master_join_cmd
      become: no

    - name: Join control plane node
      shell: "{{ master_join_cmd.content | b64decode }}"
      when: not kubelet_conf.stat.exists
      register: join_output
      ignore_errors: yes

    - name: Create .kube directory for ansible user
      file:
        path: "/home/ansible/.kube"
        state: directory
        mode: '0755'
        owner: ansible
        group: ansible
      when: join_output is succeeded or kubelet_conf.stat.exists

    - name: Copy admin.conf to ansible user kube config
      copy:
        src: /etc/kubernetes/admin.conf
        dest: "/home/ansible/.kube/config"
        remote_src: yes
        owner: ansible
        group: ansible
        mode: '0644'
      when: join_output is succeeded or kubelet_conf.stat.exists
