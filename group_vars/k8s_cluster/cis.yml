---
# K8s-safe CIS overrides for UBUNTU24-CIS
# Apply to k8s_cluster group only.
#
# Preserves:
#   - SSH access (key-based, ops-friendly)
#   - Passwordless sudo for ansible user
#   - No firewall enabled (UFW/nftables/iptables stay untouched)
#
# K8s-specific:
#   - Preserves ip_forward=1 for pod networking
#   - Disables Level 2 rules (too restrictive for lab K8s)
#   - Disables aggressive session timeouts

system_is_container: false
ubtu24cis_skip_for_test: true

# Reboot control
ubtu24cis_skip_reboot: true

# Disable Level 2 hardening (too restrictive for lab clusters)
ubtu24cis_level_2: false

# Allow high-disruption tasks to run (we've neutered the dangerous ones)
ubtu24cis_disruption_high: true

# --- NETWORKING: Preserve K8s pod routing ---
# Pretending we're a router skips CIS rules that force net.ipv4.ip_forward = 0.
ubtu24cis_is_router: true

# No IPv6 in this cluster - skip IPv6 sysctl & iptables rules
ubtu24cis_ipv6_required: false

# --- FIREWALL: Completely skip ALL firewall hardening ---
ubtu24cis_firewall_package: "none"
ubtu24cis_rule_4_1_1: false

# --- SSH: Keep permissive for lab/ops access ---
# Don't block ssh -L/-R tunnelling for K8s ops
ubtu24cis_rule_5_1_8: false
# Don't disable root login (emergency recovery access on VMs)
ubtu24cis_rule_5_1_20: false

# Disable AllowUsers/AllowGroups restriction logic
ubtu24cis_sshd_allow_users: ""
ubtu24cis_sshd_allow_groups: ""

# --- SUDO: Keep passwordless sudo working ---
# 5.2.4 replaces NOPASSWD with PASSWD
ubtu24cis_rule_5_2_4: false
# 5.2.5 re-enables authenticate globally
ubtu24cis_rule_5_2_5: false
# 5.2.7 restricts su command to a specific group
ubtu24cis_rule_5_2_7: false

# --- SESSION: No aggressive timeouts ---
ubtu24cis_shell_session_timeout: 0
